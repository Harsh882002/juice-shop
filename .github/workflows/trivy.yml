name: Trivy Juice Shop Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: SBOM and Vulnerability Scan
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Juice Shop
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 3. Check repository files
      - name: Inspect repository
        run: |
          echo "=========================================="
          echo "Repository information"
          echo "=========================================="

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo ""
          echo "package.json:"
          if [ -f package.json ]; then
            echo "FOUND"
          else
            echo "NOT FOUND"
            exit 1
          fi

          echo ""
          echo "Lock files:"
          find . -maxdepth 2 \
            \( -name "package-lock.json" \
            -o -name "npm-shrinkwrap.json" \
            -o -name "yarn.lock" \
            -o -name "pnpm-lock.yaml" \) \
            -print || true

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Show installed dependency information
      - name: Show dependency information
        run: |
          echo "=========================================="
          echo "Top-level dependencies"
          echo "=========================================="

          npm list --depth=0 || true

      # 6. Install latest Trivy
      - name: Install Trivy 0.74.0
        run: |
          curl -sfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/v0.74.0/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v0.74.0

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 7. Verify Trivy
      - name: Verify Trivy
        run: |
          echo "=========================================="
          echo "Trivy version"
          echo "=========================================="

          which trivy
          trivy --version

      # 8. Trivy filesystem vulnerability scan
      - name: Trivy filesystem vulnerability scan
        run: |
          echo "=========================================="
          echo "Trivy vulnerability scan"
          echo "=========================================="

          trivy fs \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            .

      # 9. Generate CycloneDX SBOM
      - name: Generate CycloneDX SBOM
        run: |
          echo "=========================================="
          echo "Generating SBOM"
          echo "=========================================="

          trivy fs \
            --scanners vuln \
            --format cyclonedx \
            --output sbom.json \
            .

          echo ""
          echo "SBOM generated:"
          ls -lh sbom.json

      # 10. Generate JSON vulnerability report
      - name: Generate JSON vulnerability report
        run: |
          echo "=========================================="
          echo "Generating JSON vulnerability report"
          echo "=========================================="

          trivy fs \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-results.json \
            .

          echo ""
          echo "JSON report generated:"
          ls -lh trivy-results.json

      # 11. Display vulnerability summary
      - name: Display vulnerability summary
        if: always()
        run: |
          echo "=========================================="
          echo "TRIVY VULNERABILITY RESULTS"
          echo "=========================================="

          if [ -f trivy-results.json ]; then
            python - <<'PY'
          import json

          with open("trivy-results.json") as f:
              data = json.load(f)

          total = 0

          for result in data.get("Results", []):
              vulnerabilities = result.get("Vulnerabilities", [])

              if vulnerabilities:
                  print(f"\nTarget: {result.get('Target', 'unknown')}")
                  print(f"Type: {result.get('Type', 'unknown')}")

                  for vuln in vulnerabilities:
                      total += 1

                      print(
                          f"- {vuln.get('VulnerabilityID', 'N/A')} | "
                          f"{vuln.get('PkgName', 'N/A')} | "
                          f"{vuln.get('InstalledVersion', 'N/A')} | "
                          f"{vuln.get('Severity', 'N/A')} | "
                          f"Fixed: {vuln.get('FixedVersion', 'N/A')}"
                      )

          print(f"\nTotal vulnerabilities: {total}")
          PY
          else
            echo "trivy-results.json does not exist"
          fi

      # 12. Display SBOM summary
      - name: Display SBOM summary
        if: always()
        run: |
          echo "=========================================="
          echo "SBOM SUMMARY"
          echo "=========================================="

          if [ -f sbom.json ]; then
            python - <<'PY'
          import json

          with open("sbom.json") as f:
              data = json.load(f)

          components = data.get("components", [])
          vulnerabilities = data.get("vulnerabilities", [])

          print(f"Components: {len(components)}")
          print(f"Vulnerabilities: {len(vulnerabilities)}")

          print("\nComponents found:")

          for component in components:
              name = component.get("name", "N/A")
              version = component.get("version", "N/A")
              component_type = component.get("type", "N/A")

              print(
                  f"- {name} | "
                  f"{version} | "
                  f"{component_type}"
              )
          PY
          else
            echo "sbom.json does not exist"
          fi

      # 13. Upload results
      - name: Upload Trivy assessment
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-juice-shop-assessment
          path: |
            sbom.json
            trivy-results.json
          if-no-files-found: warn
