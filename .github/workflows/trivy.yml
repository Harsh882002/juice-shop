name: Trivy Juice Shop Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Trivy
        run: |
          curl -sfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/v0.74.0/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v0.74.0

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify environment
        run: |
          echo "PWD:"
          pwd

          echo ""
          echo "Trivy:"
          trivy --version

          echo ""
          echo "Repository:"
          ls -lah

      - name: Run Trivy
        run: |
          trivy fs \
            --scanners vuln \
            --format json \
            --output ./trivy-results.json \
            .

      - name: Generate SBOM
        run: |
          trivy fs \
            --scanners vuln \
            --format cyclonedx \
            --output ./sbom.json \
            .

      - name: Verify generated files
        run: |
          echo "================================"
          echo "GENERATED FILES"
          echo "================================"

          pwd

          echo ""
          echo "trivy-results.json:"
          if [ -f ./trivy-results.json ]; then
            ls -lh ./trivy-results.json
            echo "FOUND"
          else
            echo "MISSING"
          fi

          echo ""
          echo "sbom.json:"
          if [ -f ./sbom.json ]; then
            ls -lh ./sbom.json
            echo "FOUND"
          else
            echo "MISSING"
          fi

          echo ""
          echo "All JSON files:"
          find . -maxdepth 3 -type f \
            \( -name "*.json" -o -name "*.xml" \) \
            -print

      - name: Show Trivy result
        if: always()
        run: |
          if [ -f ./trivy-results.json ]; then
            cat ./trivy-results.json
          else
            echo "No Trivy JSON file found"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-results
          path: |
            ./trivy-results.json
            ./sbom.json
          if-no-files-found: warn
