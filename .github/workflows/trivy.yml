name: Trivy Juice Shop Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Juice Shop
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency files
        run: |
          echo "=== package.json ==="
          test -f package.json && echo "package.json FOUND"

          echo "=== package-lock.json ==="
          test -f package-lock.json && echo "package-lock.json FOUND"

          echo "=== Node version ==="
          node --version

          echo "=== NPM version ==="
          npm --version

      - name: Install Trivy 0.74.0
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.74.0/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v0.74.0

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Trivy
        run: |
          which trivy
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            .

      - name: Generate SBOM
        run: |
          trivy fs \
            --scanners vuln \
            --format cyclonedx \
            --output sbom.json \
            .

          echo "=== SBOM FILE ==="
          ls -lh sbom.json

      - name: Generate JSON vulnerability report
        run: |
          trivy fs \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-results.json \
            .

          echo "=== JSON FILE ==="
          ls -lh trivy-results.json

      - name: Inspect generated files
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED FILES"
          echo "=========================================="

          ls -lah

          echo "=========================================="
          echo "TRIVY JSON"
          echo "=========================================="

          if [ -f trivy-results.json ]; then
            cat trivy-results.json
          else
            echo "trivy-results.json DOES NOT EXIST"
          fi

          echo "=========================================="
          echo "SBOM"
          echo "=========================================="

          if [ -f sbom.json ]; then
            ls -lh sbom.json
          else
            echo "sbom.json DOES NOT EXIST"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-juice-shop-results
          path: |
            sbom.json
            trivy-results.json
          if-no-files-found: warn
